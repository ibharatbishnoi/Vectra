<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Vectra Admin</title>
<link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin.css"></head>
<body>
<header class="site" id="topbar"><div class="wrap nav"><a class="brand" href="/">VECTRA <span>ADMIN</span></a>
<div class="row" style="margin:0"><span id="who" class="meta" style="margin:0"></span><a class="btn ghost" href="/">View site</a><button class="btn ghost" id="out" hidden>Sign out</button></div></div></header>
<div class="wrap">
<div id="login" class="box" style="max-width:420px;margin:40px auto"><h2>Staff sign in</h2>
<div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="username"></div>
<div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div>
<p><button class="btn" id="in">Sign in</button></p><div class="msg" id="lmsg" aria-live="polite"></div></div>
<div id="app" hidden><nav class="tabs" id="nav" role="tablist" aria-label="Admin sections"></nav><div id="view"></div></div>
</div>
<dialog id="dlg" class="adlg"><button class="dclose" id="dlgx" aria-label="Close">×</button><div id="dlgbody"></div></dialog>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/config.js"></script><script src="/shared.js"></script><script src="/admin.js"></script>
<script>if(new URLSearchParams(location.search).has("embedded"))document.body.classList.add("embedded-admin");</script>
</body></html>
